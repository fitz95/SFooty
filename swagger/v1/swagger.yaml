openapi: 3.0.0

info:
  title: Ruby App API
  description: API documentation for the Sfooty football application 
  version: 1.0.0

paths:
  /api/v1/users:
    post:
      summary: Create a new user
      description: Creates a new user account.
      tags:
        - Registrations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
 
    get:
      summary: Get all users
      description: Returns a list of all users.
      tags:
        - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Users not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
   
  /api/v1/users/sign_in:
    post:
      summary: Sign in user
      description: Authenticates a user and returns an access token.
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/UserSignIn'
      responses:
        '201':
          description: User signed in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/sign_out:
    delete:
      summary: Sign out user
      description: Logs out a user.
      tags:
        - Sessions
      responses:
        '200':
          description: Logout successful
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/password:
    put:
      summary: Update user password
      description: Updates a user's password.
      tags:
        - Passwords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/UserPasswordUpdate'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Password updated successfully
        '404':
          description: Password not updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/{id}:
    get:
      summary: Get user by ID
      description: Returns a user by ID.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the user.
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete user by ID
      description: Deletes a user by ID.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the user.
      responses:
        '200':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

