openapi: 3.0.0

info:
  title: Ruby App API
  description: API documentation for the Sfooty football application 
  version: 1.0.0

paths:
  /api/v1/users:
    post:
      summary: Create a new user
      description: Creates a new user account.
      tags:
        - Registrations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
 
    get:
      summary: Get all users
      description: Returns a list of all users.
      tags:
        - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Users not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
   
  /api/v1/users/sign_in:
    post:
      summary: Sign in user
      description: Authenticates a user and returns an access token.
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/UserSignIn'
      responses:
        '201':
          description: User signed in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/sign_out:
    delete:
      summary: Sign out user
      description: Logs out a user.
      tags:
        - Sessions
      responses:
        '200':
          description: Logout successful
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/password:
    put:
      summary: Update user password
      description: Updates a user's password.
      tags:
        - Passwords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/UserPasswordUpdate'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Password updated successfully
        '404':
          description: Password not updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/{id}:
    get:
      summary: Get user by ID
      description: Returns a user by ID.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the user.
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete user by ID
      description: Deletes a user by ID.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the user.
      responses:
        '200':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/{user_id}/leagues:
    get:
      summary: Get all leagues
      description: Retrieve a list of all leagues for a specific user.
      tags:
        - Leagues
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user.
      responses:
        '200':
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leagues'

    post:
      summary: Create a new league
      description: Create a new league for a specific user.
      tags:
        - Leagues
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLeague'
      responses:
        '201':
          description: League created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leagues'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/users/{user_id}/leagues/{id}:
    get:
      summary: Get league by ID
      description: Retrieve details of a specific league by its ID.
      tags:
        - Leagues
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user.
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID of the league.
      responses:
        '200':
          description: League details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leagues'
        '404':
          description: League not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    patch:
      summary: Update league by ID
      description: Update details of a specific league by its ID.
      tags:
        - Leagues
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user.
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID of the league.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLeague'
      responses:
        '200':
          description: League updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leagues'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    delete:
      summary: Delete league by ID
      description: Delete a specific league by its ID.
      tags:
        - Leagues
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user.
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID of the league.
      responses:
        '200':
          description: League deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: League deleted successfully!
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

components:
  schemas:
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          description: The email address of the user.
        password:
          type: string
          description: The password of the user.
        password_confirmation:
          type: string
          description: The password confirmation of the user.
        role:
          type: string
          description: The role of the user.
        first_name:
          type: string
          description: The first name of the user.
        last_name:
          type: string
          description: The last name of the user.
        username:
          type: string
          description: The username of the user.
        user_photo:
          type: string
          description: The photo of the user.
      required:
        - email
        - password
        - password_confirmation
        - username
        - user_photo

    UserSignIn:
      type: object
      properties:
        login:
          type: string
          description: The email or username of the user.
        password:
          type: string
          description: The password of the user.
      required:
        - login
        - password

    UserPasswordUpdate:
      type: object
      properties:
        email:
          type: string
          description: The email address of the user.
        password:
          type: string
          description: The new password of the user.
        password_confirmation:
          type: string
          description: The new password confirmation of the user.
      required:
        - email
        - password
        - password_confirmation

    User:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the user.
        email:
          type: string
          description: The email address of the user.
        role:
          type: string
          description: The role of the user.
        first_name:
          type: string
          description: The first name of the user.
        last_name:
          type: string
          description: The last name of the user.
        username:
          type: string
          description: The username of the user.
        user_photo:
          type: string
          description: The photo of the user.
      required:
        - id
        - email
        - role
        - first_name
        - last_name
        - username
        - user_photo

    NewLeague:
      type: object
      properties:
        league_name:
          type: string
          description: The name of the league.
        country:
          type: string
          description: The country of the league.
        tier_level:
          type: integer
          description: The tier level of the league.
        description:
          type: string
          description: A description of the league.
        league_photo:
          type: string
          description: The photo of the league.
      required:
        - league_name
        - country
        - tier_level

    Leagues:
      type: object
      properties:
        id:
          type: integer
          example: 1
        league_name:
          type: string
          example: Premier League
        country:
          type: string
          example: England
        tier_level:
          type: integer
          example: 1
        description:
          type: string
          example: "Top tier of English football"
        league_photo:
          type: string
          example: "https://example.com/photo.jpg"
        user_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2023-10-29T12:34:56Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-10-29T12:34:56Z"

  securitySchemes:
    BearerAuth:
      type: apiKey
      name: Authorization
      in: header
      description: Enter your Bearer token in the format 'Bearer {token}'

security:
  - BearerAuth: []
