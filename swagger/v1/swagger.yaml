components:
  schemas:
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          description: The email address of the user.
        password:
          type: string
          description: The password of the user.
        password_confirmation:
          type: string
          description: The password confirmation of the user.
        role:
          type: string
          description: The role of the user.
        first_name:
          type: string
          description: The first name of the user.
        last_name:
          type: string
          description: The last name of the user.
        username:
          type: string
          description: The username of the user.
        user_photo:
          type: string
          description: The photo of the user.
      required:
        - email
        - password
        - password_confirmation
        - username
        - user_photo

    UserSignIn:
      type: object
      properties:
        login:
          type: string
          description: The email or username of the user.
        password:
          type: string
          description: The password of the user.
      required:
        - login
        - password

    UserPasswordUpdate:
      type: object
      properties:
        email:
          type: string
          description: The email address of the user.
        password:
          type: string
          description: The new password of the user.
        password_confirmation:
          type: string
          description: The new password confirmation of the user.
      required:
        - email
        - password
        - password_confirmation

    User:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the user.
        email:
          type: string
          description: The email address of the user.
        role:
          type: string
          description: The role of the user.
        first_name:
          type: string
          description: The first name of the user.
        last_name:
          type: string
          description: The last name of the user.
        username:
          type: string
          description: The username of the user.
        user_photo:
          type: string
          description: The photo of the user.
      required:
        - id
        - email
        - role
        - first_name
        - last_name
        - username
        - user_photo

    NewLeague:
      type: object
      properties:
        league_name:
          type: string
          description: The name of the league.
        country:
          type: string
          description: The country of the league.
        tier_level:
          type: integer
          description: The tier level of the league.
        description:
          type: string
          description: A description of the league.
        league_photo:
          type: string
          description: The photo of the league.
      required:
        - league_name
        - country
        - tier_level

    Leagues:
      type: object
      properties:
        id:
          type: integer
          example: 1
        league_name:
          type: string
          example: Premier League
        country:
          type: string
          example: England
        tier_level:
          type: integer
          example: 1
        description:
          type: string
          example: "Top tier of English football"
        league_photo:
          type: string
          example: "https://example.com/photo.jpg"
        user_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2023-10-29T12:34:56Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-10-29T12:34:56Z"

    NewTeam:
      type: object
      properties:
        team_name:
          type: string
        country:
          type: string
        founded_year:
          type: integer
        description:
          type: string
        coach_name:
          type: string
        website:
          type: string
        trophy_photo:
          type: string
      required:
        - team_name
        - country
    
    Team:
      type: object
      properties:
        id:
          type: integer
        team_name:
          type: string
        country:
          type: string
        founded_year:
          type: integer
        description:
          type: string
        coach_name:
          type: string
        website:
          type: string
        trophy_photo:
          type: string
        user_id:
          type: integer
        league_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - team_name
        - country
    
    NewPlayer:
      type: object
      properties:
        player_name:
          type: string
          description: The name of the player.
